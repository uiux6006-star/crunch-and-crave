{# Invisible to people; bots fill in hp_contact. #}
<div class="hp-field" aria-hidden="true">
    <label for="hp_contact_{{ form.prefix|default:'f' }}">Leave this empty</label>
    <input type="text" id="hp_contact_{{ form.prefix|default:'f' }}" name="hp_contact" tabindex="-1" autocomplete="off">
</div>
<input type="hidden" name="form_ts" value="{{ form.form_ts.value }}">
{% if form.non_field_errors %}
<div class="form-alert" role="alert">
    <i class="fa-solid fa-circle-exclamation"></i>
    <div>{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>
</div>
{% endif %}
