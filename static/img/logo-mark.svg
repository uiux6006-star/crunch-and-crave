<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crunch &amp; Crave">
  <defs>
    <linearGradient id="cc-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.45" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#e2370a"/>
    </linearGradient>
    <linearGradient id="cc-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- The "bite" taken out of the top-right corner -->
    <mask id="cc-bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="61" cy="3" r="10" fill="#000"/>
      <circle cx="49" cy="-3" r="7" fill="#000"/>
      <circle cx="67" cy="16" r="7" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#cc-bite)">
    <rect width="64" height="64" rx="18" fill="url(#cc-fill)"/>
    <rect width="64" height="64" rx="18" fill="url(#cc-shine)"/>
  </g>

  <!-- Bold "C" -->
  <path d="M41.2 23.6 A14.5 14.5 0 1 0 41.2 44.4" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Crunch crumbs -->
  <circle cx="47.5" cy="34" r="2.6" fill="#fff"/>
  <circle cx="52.5" cy="28.5" r="1.7" fill="#fff" opacity="0.85"/>
  <circle cx="52.5" cy="39.5" r="1.7" fill="#fff" opacity="0.85"/>
</svg>
