{% extends "base.html" %}

    <div class="container" style="grid-template-columns:1fr">

            <span class="empty-icon"><i class="fa-solid fa-burger"></i></span>

                <a href="{% url 'home' %}" class="btn btn-ghost">Go home</a>

        </div>
    </div>
